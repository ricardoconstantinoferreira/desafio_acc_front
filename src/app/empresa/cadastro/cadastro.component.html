<section class="empresa-page">
  <header class="empresa-header">
    <h1>Empresas</h1>
  </header>

  <main>
    <section class="card">
      <h2>{{ editingEmpresaId !== null ? 'Alteracao de Empresa' : 'Cadastro de Empresas' }}</h2>

      <form [formGroup]="form" (ngSubmit)="salvar()" class="empresa-form">
        <label for="documento">Documento</label>
        <input id="documento" type="text" formControlName="documento" placeholder="Digite o documento" (input)="onDocumentoInput($event)" />
        <small class="error" *ngIf="form.controls.documento.touched && form.controls.documento.invalid">
          Documento e obrigatorio.
        </small>

        <label for="nomeFantasia">Nome Fantasia</label>
        <input id="nomeFantasia" type="text" formControlName="nomeFantasia" placeholder="Digite o nome fantasia" />
        <small class="error" *ngIf="form.controls.nomeFantasia.touched && form.controls.nomeFantasia.invalid">
          Nome fantasia e obrigatorio.
        </small>

        <label for="cep">CEP</label>
        <input id="cep" type="text" formControlName="cep" placeholder="Digite o CEP" (input)="onCepInput($event)" />
        <small class="error" *ngIf="form.controls.cep.touched && form.controls.cep.invalid">
          CEP e obrigatorio.
        </small>

        <button type="submit">{{ editingEmpresaId !== null ? 'Alterar' : 'Salvar empresa' }}</button>
      </form>
    </section>
  </main>

  <div *ngIf="showModal" class="modal-backdrop" (click)="closeModal()">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" (click)="$event.stopPropagation()">
      <h3 id="modal-title" [class.modal-success]="modalType === 'success'" [class.modal-error]="modalType === 'error'">
        {{ modalTitle }}
      </h3>
      <p>{{ modalMessage }}</p>
      <button type="button" (click)="closeModal()">Fechar</button>
    </section>
  </div>
</section>
